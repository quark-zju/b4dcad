<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>__SOURCE_NAME__</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f0; }
    body { display: flex; flex-direction: column; }
    canvas { display: block; }
    #workspace { display: flex; flex: 1; min-height: 0; }
    #viewport { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; }
    #bar {
      flex-shrink: 0; z-index: 1;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      font: 13px system-ui, sans-serif; color: #222;
      background: rgba(255,255,255,.88); padding: 10px 12px; border-bottom: 1px solid #ddd;
    }
    #bar button {
      appearance: none; border: 1px solid #ccc; background: #fff; color: #222;
      padding: 6px 10px; cursor: pointer; border-radius: 0;
    }
    #bar button[aria-pressed="true"] {
      background: #222; color: #fff; border-color: #222;
    }
    #bar button:disabled {
      background: #eee; color: #777; border-color: #ccc; cursor: default;
    }
    .button-group {
      display: inline-flex;
      gap: 0;
    }
    .button-group > button + button,
    .button-group > .solid-control + button {
      margin-left: -1px;
    }
    .button-group button[aria-pressed="true"] {
      position: relative;
      z-index: 1;
    }
    .solid-control {
      position: relative;
      display: inline-flex;
    }
    #bar .solid-control > [data-mode="solid"] {
      padding-right: 44px;
    }
    #bar #toggle-ao {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      padding: 2px 4px;
      font-size: 10px;
      line-height: 1.2;
      background: #555;
      color: #fff;
      border-color: #888;
    }
    #bar #toggle-ao[aria-pressed="true"] {
      background: #fff;
      color: #222;
      border-color: #ccc;
    }
    #bar #toggle-ao:disabled {
      background: #eee;
      color: #777;
      border-color: #ccc;
    }
    #bar .error {
      color: #8a1f11;
    }
    #status:empty { display: none; }
    #error-panel {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 58px;
      z-index: 2;
      max-height: 42vh;
      overflow: auto;
      white-space: pre-wrap;
      color: #2b120f;
      background: #fff8f7;
      border: 1px solid #d7a29a;
      padding: 10px 12px;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    #error-panel[hidden] {
      display: none;
    }
    #components {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      max-width: 100%;
      row-gap: 4px;
    }
    #components button {
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    #tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-left: auto;
    }
    #view-tools {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    #source-name {
      font-weight: 600;
    }
    #source-name::after { content: " ▾"; font-size: 10px; }
    #source-name[aria-busy="true"]::after { content: " …"; }
    #source-picker { position: relative; min-width: 0; }
    #file-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(420px, calc(100vw - 24px));
      max-height: min(560px, 70vh);
      overflow: auto;
      box-sizing: border-box;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      z-index: 3;
    }
    #file-menu[hidden] { display: none; }
    #file-root { font-weight: 600; margin-bottom: 6px; overflow-wrap: anywhere; }
    #file-menu ul { list-style: none; margin: 3px 0; padding-left: 14px; }
    #file-menu summary { padding: 4px 0; cursor: pointer; overflow-wrap: anywhere; }
    #bar #file-menu button { border-color: transparent; padding: 4px 6px; text-align: left; overflow-wrap: anywhere; }
    #bar #file-menu button[aria-current="page"] { background: #d8f3ff; border-color: #64b8d4; }
    #dimensions {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 1;
      padding: 7px 10px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.88);
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      color: #222;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      max-width: calc(100% - 40px);
      overflow-wrap: anywhere;
    }
    #dimensions[hidden] {
      display: none;
    }
    canvas.measuring { cursor: crosshair; }
    #measure-panel, #measure-label {
      position: absolute;
      z-index: 1;
      padding: 7px 10px;
      border: 1px solid rgba(0,0,0,.16);
      background: rgba(255,255,255,.94);
      color: #173047;
      font: 13px system-ui, sans-serif;
    }
    #measure-panel { top: 12px; left: 12px; max-width: calc(100% - 46px); }
    #measure-panel output { display: block; white-space: pre-line; margin-top: 6px; }
    #measure-label { transform: translate(-50%, -120%); pointer-events: none; white-space: nowrap; }
    .dimension-axis {
      font-weight: 700;
    }
    #tree-panel {
      flex: 0 0 min(340px, 40%);
      min-width: 0;
      box-sizing: border-box;
      overflow: auto;
      background: rgba(255,255,255,.94);
      border-left: 1px solid #ccc;
      padding: 10px;
      font: 12px system-ui, sans-serif;
    }
    #tree-panel[hidden] { display: none; }
    #tree-panel ul { list-style: none; margin: 4px 0; padding-left: 16px; }
    #tree-panel button {
      font: inherit;
      color: #222;
      background: transparent;
      border: 1px solid transparent;
      padding: 3px 5px;
      text-align: left;
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    #tree-panel button[aria-pressed="true"] {
      background: #d8f3ff;
      border-color: #64b8d4;
    }
    #tree-panel summary { cursor: pointer; }
    #tree-panel p { color: #666; }
    #tree-panel h2 { font-size: 13px; margin: 12px 0 6px; }
    #tree-panel .assignment-source { display: block; padding-left: 5px; color: #666; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <nav id="bar" aria-label="Preview controls">
    <div id="source-picker">
      <button type="button" id="source-name" aria-expanded="false" aria-controls="file-menu">__SOURCE_NAME__</button>
      <section id="file-menu" aria-label="Python source files" hidden>
        <div id="file-root"></div>
        <div id="file-tree"></div>
      </section>
    </div>
    <span id="components" class="button-group"></span>
    <button type="button" id="show-in-finder" hidden disabled>Show in Finder</button>
    <span id="tools">
      <span class="button-group" role="group" aria-label="Model tools">
        <button type="button" id="toggle-tree" aria-pressed="false" aria-controls="tree-panel">Tree</button>
        <button type="button" id="toggle-measure" aria-pressed="false" aria-controls="measure-panel" disabled>Measure</button>
      </span>
      <span id="view-tools" role="group" aria-label="View">
        <span class="button-group" role="group" aria-label="Display mode">
          <span class="solid-control">
            <button type="button" data-mode="solid" aria-pressed="true">Solid</button>
            <button type="button" id="toggle-ao" aria-label="Ambient occlusion" aria-pressed="false" title="Ambient occlusion adds shading inside corners and holes (Solid mode)">AO</button>
          </span>
          <button type="button" data-mode="wireframe" aria-pressed="false">Wire</button>
          <button type="button" data-mode="transparent" aria-pressed="false">Translucent</button>
        </span>
        <button type="button" id="reset-view">Reset View</button>
      </span>
    </span>
    <span id="status" class="error" aria-live="polite"></span>
  </nav>
  <pre id="error-panel" hidden></pre>
  <main id="workspace">
    <div id="viewport">
      <output id="dimensions" aria-live="polite" hidden></output>
      <section id="measure-panel" aria-label="Measurements" hidden>
        <label>Pick <select>
          <option value="auto">Auto (vertex, edge, face)</option>
          <option value="point">Point on surface</option>
        </select></label>
        <button type="button">Clear</button>
        <output aria-live="polite"></output>
      </section>
      <span id="measure-label" aria-hidden="true" hidden></span>
    </div>
    <aside id="tree-panel" aria-label="Model construction tree" hidden>
      <button type="button" id="clear-selection">Clear selection</button>
      <div id="tree-content">
        <section aria-labelledby="object-tree-heading">
          <h2 id="object-tree-heading">Object tree</h2>
          <div id="object-tree-content"></div>
        </section>
        <details id="assignment-history">
          <summary id="assignment-history-summary">Assignment history</summary>
          <ul id="assignment-history-content"></ul>
        </details>
      </div>
    </aside>
  </main>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";
    import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { SSAOPass } from "three/addons/postprocessing/SSAOPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { PreviewMeasure } from "./preview-measure.js";

    const components = document.querySelector("#components");
    const sourcePicker = document.querySelector("#source-picker");
    const sourceButton = document.querySelector("#source-name");
    const fileMenu = document.querySelector("#file-menu");
    const fileTree = document.querySelector("#file-tree");
    const status = document.querySelector("#status");
    const errorPanel = document.querySelector("#error-panel");
    const resetViewButton = document.querySelector("#reset-view");
    const finderButton = document.querySelector("#show-in-finder");
    const aoButton = document.querySelector("#toggle-ao");
    const treeButton = document.querySelector("#toggle-tree");
    const treePanel = document.querySelector("#tree-panel");
    const treeContent = document.querySelector("#tree-content");
    const viewport = document.querySelector("#viewport");
    const objectTreeContent = document.querySelector("#object-tree-content");
    const assignmentHistory = document.querySelector("#assignment-history");
    const assignmentHistoryContent = document.querySelector("#assignment-history-content");
    const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));
    const dimensions = document.querySelector("#dimensions");
    const showError = (message) => {
      status.textContent = message;
      errorPanel.hidden = true;
      errorPanel.textContent = "";
    };
    const showBuildError = (error) => {
      status.textContent = `Model build failed: ${error.message || "unknown error"}`;
      errorPanel.textContent = error.traceback || error.message || "Unknown model build error";
      errorPanel.hidden = false;
    };
    const clearError = (message) => {
      if (!message || status.textContent === message) {
        status.textContent = "";
        errorPanel.hidden = true;
        errorPanel.textContent = "";
      }
    };

    const scene = new THREE.Scene();
    const highlightScene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f0);
    const viewportWidth = Math.max(1, viewport.clientWidth);
    const viewportHeight = Math.max(1, viewport.clientHeight);
    const camera = new THREE.PerspectiveCamera(45, viewportWidth / viewportHeight, 0.01, 10000);
    camera.up.set(0, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(viewportWidth, viewportHeight);
    renderer.setPixelRatio(devicePixelRatio);
    viewport.appendChild(renderer.domElement);

    // Keep antialiasing in the offscreen color pass as well as the direct renderer.
    const renderTarget = new THREE.WebGLRenderTarget(viewportWidth, viewportHeight, {
      type: THREE.HalfFloatType,
      samples: renderer.capabilities.isWebGL2 ? 4 : 0,
    });
    const composer = new EffectComposer(renderer, renderTarget);
    composer.addPass(new RenderPass(scene, camera));
    const aoPass = new SSAOPass(scene, camera, viewportWidth, viewportHeight, 16);
    composer.addPass(aoPass);
    composer.addPass(new OutputPass());
    composer.setSize(viewportWidth, viewportHeight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = false;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 0.8;
    controls.panSpeed = 0.7;
    controls.screenSpacePanning = false;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x606060, 2.4));
    const key = new THREE.DirectionalLight(0xffffff, 1.5);
    key.position.set(1, -2, 3);
    scene.add(key);

    const axes = new THREE.Group();
    scene.add(axes);
    const axisColors = {
      x: 0xcc2020,
      y: 0x208a20,
      z: 0x205dcc,
    };

    function makeAxis(direction, color, length) {
      const points = [
        direction.clone().multiplyScalar(-length),
        direction.clone().multiplyScalar(length),
      ];
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color, depthTest: true });
      const line = new THREE.Line(geometry, material);
      return line;
    }

    function axisLengthForModel() {
      return Math.max(modelSize * 12, modelExtentFromOrigin * 1.2, 120);
    }

    function drawAxes(length) {
      axes.clear();
      axes.add(makeAxis(new THREE.Vector3(1, 0, 0), axisColors.x, length));
      axes.add(makeAxis(new THREE.Vector3(0, 1, 0), axisColors.y, length));
      axes.add(makeAxis(new THREE.Vector3(0, 0, 1), axisColors.z, length));
    }

    const loader = new STLLoader();
    let mesh = null;
    let edgeLines = null;
    let currentGeometry = null;
    let activeName = null;
    let modelSize = 1;
    let modelCenter = new THREE.Vector3(0, 0, 0);
    let modelExtentFromOrigin = 1;
    let viewMode = "solid";
    let aoEnabled = false;
    let framePending = false;
    let treeData = { nodes: {}, roots: {}, assignments: [] };
    let treeVersion = null;
    let selectedNode = null;
    let highlight = null;
    let selectionRequest = 0;
    let modelRequest = 0;
    let assignmentsByNode = new Map();
    let activeSource = null;
    let selectingFile = false;
    const measure = new PreviewMeasure({
      renderer, camera, requestRender,
      panel: document.querySelector("#measure-panel"),
      button: document.querySelector("#toggle-measure"),
      label: document.querySelector("#measure-label"),
      format: formatDimension,
      onEnable: clearSelection,
    });
    let fileMenuRequest = 0;
    let canShowInFinder = false;
    let showingInFinder = false;

    function updateFinderButton() {
      finderButton.hidden = !canShowInFinder || activeName?.startsWith("show") === true;
      finderButton.disabled = finderButton.hidden || !activeName || selectingFile || showingInFinder;
    }

    function resetFinderFeedback() {
      finderButton.title = "Export non-show models and reveal the selected part in Finder";
    }

    async function showInFinder() {
      if (!canShowInFinder || !activeName || activeName.startsWith("show") || selectingFile || showingInFinder) return;
      const name = activeName;
      const source = activeSource;
      const version = treeVersion;
      showingInFinder = true;
      resetFinderFeedback();
      updateFinderButton();
      try {
        const response = await fetch("/show-in-finder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, source, tree_version: version }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        if (source === activeSource && name === activeName && version === treeVersion) {
          finderButton.title = result.path;
        }
      } catch (error) {
        if (source === activeSource && name === activeName && version === treeVersion) {
          resetFinderFeedback();
          showError(`Failed to show model in Finder: ${error.message || error}`);
        }
      } finally {
        showingInFinder = false;
        updateFinderButton();
      }
    }

    function closeFileMenu() {
      fileMenuRequest++;
      fileMenu.hidden = true;
      sourceButton.setAttribute("aria-expanded", "false");
    }

    function fileTreeNode(entry, selected) {
      const item = document.createElement("li");
      if (!entry.children) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = entry.name;
        button.title = entry.path;
        button.setAttribute("aria-current", entry.path === selected ? "page" : "false");
        button.addEventListener("click", () => selectFile(entry.path));
        item.append(button);
        return item;
      }
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = entry.name;
      details.append(summary);
      let built = false;
      details.addEventListener("toggle", () => {
        if (!details.isConnected || !details.open || built) return;
        built = true;
        const list = document.createElement("ul");
        for (const child of entry.children) list.append(fileTreeNode(child, selected));
        details.append(list);
      });
      details.open = selected.startsWith(`${entry.path}/`);
      item.append(details);
      return item;
    }

    async function openFileMenu() {
      fileMenu.hidden = false;
      sourceButton.setAttribute("aria-expanded", "true");
      const request = ++fileMenuRequest;
      fileTree.textContent = "Loading…";
      try {
        const response = await fetch("/files.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (request !== fileMenuRequest || fileMenu.hidden) return;
        document.querySelector("#file-root").textContent = data.root;
        const list = document.createElement("ul");
        for (const entry of data.files) list.append(fileTreeNode(entry, data.selected));
        fileTree.replaceChildren(list);
      } catch (error) {
        if (request === fileMenuRequest) fileTree.textContent = `Failed to list files: ${error.message || error}`;
      }
    }

    async function selectFile(path) {
      if (selectingFile) return;
      closeFileMenu();
      if (path === activeSource) return;
      selectingFile = true;
      updateFinderButton();
      sourceButton.disabled = true;
      sourceButton.setAttribute("aria-busy", "true");
      // Serialize file changes with live reloads so older state cannot replace a new file.
      const task = modelListRefresh.catch(() => {}).then(async () => {
        modelRequest++;
        clearSelection();
        measure.setGeometry(null);
        const response = await fetch("/select-file", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        applyPreviewState(await response.json());
      });
      modelListRefresh = task.catch(() => {});
      try {
        await task;
      } catch (error) {
        measure.setGeometry(currentGeometry);
        showError(`Failed to switch file: ${error.message || error}`);
      } finally {
        selectingFile = false;
        updateFinderButton();
        sourceButton.disabled = false;
        sourceButton.removeAttribute("aria-busy");
      }
    }

    function requestRender() {
      if (framePending) return;
      framePending = true;
      requestAnimationFrame(() => {
        framePending = false;
        renderPreview();
      });
    }

    function renderPreview() {
      if (!aoEnabled || viewMode !== "solid" || !mesh) {
        renderer.render(scene, camera);
      } else {
        // SSAOPass r164 caches camera uniforms; refresh after clipping or aspect changes.
        const uniforms = aoPass.ssaoMaterial.uniforms;
        uniforms.cameraNear.value = camera.near;
        uniforms.cameraFar.value = camera.far;
        uniforms.cameraProjectionMatrix.value.copy(camera.projectionMatrix);
        uniforms.cameraInverseProjectionMatrix.value.copy(camera.projectionMatrixInverse);
        aoPass.kernelRadius = modelSize * 0.04;
        const depthScale = modelSize / (camera.far - camera.near);
        aoPass.minDistance = depthScale * 0.001;
        aoPass.maxDistance = depthScale * 0.08;
        composer.render();
      }
      if (highlight) {
        // Draw selection separately so it cannot alter the model's AO depth/normal buffers.
        renderer.autoClear = false;
        renderer.render(highlightScene, camera);
        renderer.autoClear = true;
      }
      measure.render();
    }

    function clearSelection() {
      selectionRequest++;
      selectedNode = null;
      if (highlight) {
        highlightScene.remove(highlight);
        highlight.geometry.dispose();
        highlight.material.dispose();
        highlight = null;
      }
      for (const button of treeContent.querySelectorAll("[data-node]")) {
        button.setAttribute("aria-pressed", "false");
      }
      if (currentGeometry) updateDimensions(new THREE.Box3().setFromBufferAttribute(currentGeometry.attributes.position));
      requestRender();
    }

    function selectNode(key) {
      if (!treeData.nodes[key]) return;
      measure.setEnabled(false);
      clearSelection();
      selectedNode = key;
      const request = selectionRequest;
      for (const button of treeContent.querySelectorAll("[data-node]")) {
        button.setAttribute("aria-pressed", String(button.dataset.node === key));
      }
      loader.load(`/tree/${treeVersion}/${encodeURIComponent(key)}.stl`, (geometry) => {
        if (request !== selectionRequest) {
          geometry.dispose();
          return;
        }
        if (geometry.attributes.position.count === 0) {
          geometry.dispose();
          dimensions.textContent = "Selected shape is empty · 0 × 0 × 0 mm";
          dimensions.hidden = false;
          requestRender();
          return;
        }
        const material = new THREE.MeshBasicMaterial({ color: 0x21b9ec, transparent: true, opacity: 0.65, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
        highlight = new THREE.Mesh(geometry, material);
        highlightScene.add(highlight);
        updateDimensions(new THREE.Box3().setFromBufferAttribute(geometry.attributes.position), geometry, treeData.nodes[key].names.join(" / "));
        requestRender();
      }, undefined, (error) => {
        if (request === selectionRequest) {
          clearSelection();
          showError(`Failed to load selection: ${error.message || error}`);
        }
      });
    }

    function nodeButton(key, label) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.node = key;
      button.textContent = label;
      button.setAttribute("aria-pressed", String(selectedNode === key));
      button.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        selectNode(key);
      });
      return button;
    }

    function treeNode(key) {
      const node = treeData.nodes[key];
      const item = document.createElement("li");
      const button = nodeButton(key, `${node.names.join(" / ")}${node.operation === "+" ? " (+)" : ""}`);
      if (!node.children.length) {
        item.append(button);
        appendAssignmentSources(item, key);
        return item;
      }
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.append(button);
      appendAssignmentSources(summary, key);
      details.append(summary);
      let built = false;
      details.addEventListener("toggle", () => {
        if (!details.isConnected || !details.open || built) return;
        built = true;
        const list = document.createElement("ul");
        for (const child of node.children) list.append(treeNode(child));
        details.append(list);
      });
      item.append(details);
      return item;
    }

    function assignmentLabel(assignment) {
      const filename = assignment.file.split(/[\\/]/).pop();
      return `${assignment.name} · ${filename}:${assignment.line} · ${assignment.scope}`;
    }

    function appendAssignmentSources(parent, key) {
      for (const assignment of assignmentsByNode.get(key) || []) {
        const source = document.createElement("small");
        source.className = "assignment-source";
        source.textContent = assignmentLabel(assignment);
        parent.append(source);
      }
    }

    function rebuildObjectTree() {
      objectTreeContent.replaceChildren();
      const root = treeData.roots[activeName];
      if (root && treeData.nodes[root]) {
        const list = document.createElement("ul");
        const item = treeNode(root);
        list.append(item);
        objectTreeContent.append(list);
        const details = item.querySelector("details");
        if (details) details.open = true;
      } else {
        const message = document.createElement("p");
        message.textContent = "No recorded Solid tree for this shape.";
        objectTreeContent.append(message);
      }
    }

    function buildAssignmentHistory() {
      if (!assignmentHistory.open || assignmentHistoryContent.childElementCount) return;
      for (const assignment of treeData.assignments) {
        const item = document.createElement("li");
        item.append(nodeButton(assignment.node, assignmentLabel(assignment)));
        assignmentHistoryContent.append(item);
      }
    }

    function rebuildTree() {
      assignmentsByNode = new Map();
      for (const assignment of treeData.assignments) {
        if (!assignmentsByNode.has(assignment.node)) assignmentsByNode.set(assignment.node, []);
        assignmentsByNode.get(assignment.node).push(assignment);
      }
      rebuildObjectTree();
      document.querySelector("#assignment-history-summary").textContent = `Assignment history (${treeData.assignments.length})`;
      assignmentHistoryContent.replaceChildren();
      buildAssignmentHistory();
    }

    function materialForMode() {
      if (viewMode === "transparent") {
        return new THREE.MeshStandardMaterial({ color: 0xb8aa2e, roughness: 0.48, metalness: 0.05, transparent: true, opacity: 0.34, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
      }
      // Push the solid surface back slightly so its feature edges do not flicker.
      return new THREE.MeshStandardMaterial({ color: 0xb8aa2e, roughness: 0.48, metalness: 0.05, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    }

    function removeObject(object, disposeGeometry = true) {
      if (!object) return;
      scene.remove(object);
      if (disposeGeometry) object.geometry.dispose();
      object.material.dispose();
    }

    function rebuildModelDisplay() {
      removeObject(mesh, false);
      removeObject(edgeLines);
      mesh = null;
      edgeLines = null;
      if (!currentGeometry) return;

      if (viewMode === "solid" || viewMode === "wireframe") {
        const solid = viewMode === "solid";
        // Suppress small tessellation edges on curved surfaces in solid mode.
        const edges = new THREE.EdgesGeometry(currentGeometry, solid ? 20 : 1);
        const material = new THREE.LineBasicMaterial({ color: 0x756c1d, depthTest: true, transparent: solid, opacity: solid ? 0.55 : 1, depthWrite: !solid });
        edgeLines = new THREE.LineSegments(edges, material);
        scene.add(edgeLines);
        if (!solid) return;
      }

      mesh = new THREE.Mesh(currentGeometry, materialForMode());
      scene.add(mesh);
    }

    function applyMode(mode) {
      viewMode = mode;
      aoButton.disabled = mode !== "solid";
      for (const button of modeButtons) {
        button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
      }
      if (mesh) {
        rebuildModelDisplay();
      } else if (edgeLines) {
        rebuildModelDisplay();
      }
      requestRender();
    }

    function updateCameraClipping() {
      camera.near = Math.max(modelSize / 1000, 0.01);
      camera.far = Math.max(
        modelSize * 100,
        axisLengthForModel() * 2,
        modelCenter.length() + modelSize * 10,
        100,
      );
      camera.updateProjectionMatrix();
    }

    function resetView() {
      const distance = Math.max(modelSize * 1.45, 10);
      camera.position.copy(modelCenter).add(new THREE.Vector3(distance, -distance, distance));
      camera.up.set(0, 0, 1);
      controls.target.copy(modelCenter);
      updateCameraClipping();
      controls.update();
      requestRender();
    }

    function setActiveButton(name) {
      for (const button of components.querySelectorAll("button")) {
        button.setAttribute("aria-pressed", String(button.dataset.name === name));
      }
    }

    function formatDimension(value) {
      return Number(value.toFixed(3)).toLocaleString(undefined, {
        maximumFractionDigits: 3,
      });
    }

    function dimensionFragment(axis, value) {
      const fragment = document.createDocumentFragment();
      const label = document.createElement("span");
      label.className = "dimension-axis";
      label.style.color = `#${axisColors[axis].toString(16).padStart(6, "0")}`;
      label.textContent = axis.toUpperCase();
      fragment.append(label, ` ${formatDimension(value)}`);
      return fragment;
    }

    function estimateVolume(geometry, origin) {
      const positions = geometry.attributes.position;
      const index = geometry.index;
      const count = index ? index.count : positions.count;
      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      const c = new THREE.Vector3();
      const cross = new THREE.Vector3();
      let signedVolume = 0;
      // Sum oriented tetrahedra about the box center to reduce cancellation
      // for models translated far from the coordinate origin.
      for (let i = 0; i < count; i += 3) {
        a.fromBufferAttribute(positions, index ? index.getX(i) : i).sub(origin);
        b.fromBufferAttribute(positions, index ? index.getX(i + 1) : i + 1).sub(origin);
        c.fromBufferAttribute(positions, index ? index.getX(i + 2) : i + 2).sub(origin);
        signedVolume += a.dot(cross.crossVectors(b, c)) / 6;
      }
      return Math.abs(signedVolume);
    }

    function updateDimensions(box, geometry = currentGeometry, label = null) {
      const size = box.getSize(new THREE.Vector3());
      dimensions.replaceChildren(
        dimensionFragment("x", size.x),
        " × ",
        dimensionFragment("y", size.y),
        " × ",
        dimensionFragment("z", size.z),
        " mm",
      );
      if (label) {
        const name = document.createElement("div");
        name.textContent = label;
        dimensions.prepend(name);
      }
      const volume = document.createElement("div");
      volume.textContent = `Volume ≈ ${formatDimension(estimateVolume(geometry, box.getCenter(new THREE.Vector3())))} mm³`;
      dimensions.append(volume);
      dimensions.hidden = false;
    }

    function loadModel(name, options = {}) {
      clearSelection();
      measure.setGeometry(null);
      const request = ++modelRequest;
      const resetCamera = options.resetCamera !== false;
      activeName = name;
      resetFinderFeedback();
      updateFinderButton();
      setActiveButton(name);
      rebuildTree();
      const url = `/model/${encodeURIComponent(name)}.stl?ts=${Date.now()}`;
      loader.load(url, (geometry) => {
        if (request !== modelRequest) {
          geometry.dispose();
          return;
        }
        geometry = mergeVertices(geometry, 1e-5);
        geometry.computeVertexNormals();
        removeObject(mesh, false);
        removeObject(edgeLines);
        if (currentGeometry) currentGeometry.dispose();
        currentGeometry = geometry;
        measure.setGeometry(geometry);
        rebuildModelDisplay();

        const box = new THREE.Box3().setFromBufferAttribute(currentGeometry.attributes.position);
        if (!selectedNode) updateDimensions(box);
        modelSize = box.getSize(new THREE.Vector3()).length();
        modelCenter = box.getCenter(new THREE.Vector3());
        modelExtentFromOrigin = Math.max(
          Math.abs(box.min.x), Math.abs(box.max.x),
          Math.abs(box.min.y), Math.abs(box.max.y),
          Math.abs(box.min.z), Math.abs(box.max.z),
        );
        drawAxes(axisLengthForModel());
        axes.visible = true;
        if (resetCamera) {
          resetView();
        } else {
          updateCameraClipping();
          controls.update();
        }
        requestRender();
      }, undefined, (error) => {
        if (request === modelRequest) showError(`Failed to load ${name}: ${error.message || error}`);
      });
    }

    let modelListRefresh = Promise.resolve();

    async function loadModelList(options = {}) {
      const response = await fetch(`/state.json?ts=${Date.now()}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      applyPreviewState(await response.json(), options);
    }

    function clearModel() {
      modelRequest++;
      clearSelection();
      measure.setGeometry(null);
      removeObject(mesh, false);
      removeObject(edgeLines);
      if (currentGeometry) currentGeometry.dispose();
      mesh = null;
      edgeLines = null;
      currentGeometry = null;
      activeName = null;
      resetFinderFeedback();
      updateFinderButton();
      axes.visible = false;
      dimensions.hidden = true;
      requestRender();
    }

    function applyPreviewState(state, options = {}) {
      canShowInFinder = state.can_show_in_finder === true;
      const sourceChanged = state.source !== activeSource;
      const preserveView = options.preserveView === true && !sourceChanged;
      const previousActiveName = sourceChanged ? null : activeName;
      if (sourceChanged) {
        clearModel();
        closeFileMenu();
      }
      activeSource = state.source;
      sourceButton.textContent = state.source.split("/").pop();
      sourceButton.title = state.source;
      document.title = sourceButton.textContent;
      clearSelection();
      treeData = state.tree || { nodes: {}, roots: {}, assignments: [] };
      treeVersion = state.tree_version;
      const models = state.models || [];
      if (state.error) {
        showBuildError(state.error);
      } else {
        clearError();
      }
      components.textContent = "";
      for (const name of models) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.name = name;
        button.textContent = name;
        button.addEventListener("click", () => loadModel(name));
        components.append(button);
      }
      if (models.length === 0) {
        clearModel();
        rebuildTree();
        if (!state.error) {
          showError("No public b4dcad Solid or CadQuery Workplane variables found");
        }
        return;
      }
      const selectedName = models.includes(previousActiveName) ? previousActiveName : models[0];
      loadModel(selectedName, {
        resetCamera: !(preserveView && selectedName === previousActiveName),
      });
    }

    function refreshModelList() {
      modelListRefresh = modelListRefresh
        .catch(() => {})
        .then(() => loadModelList({ preserveView: true }))
        .catch((error) => showError(`Failed to refresh models: ${error.message || error}`));
      return modelListRefresh;
    }

    refreshModelList();

    resetViewButton.addEventListener("click", resetView);
    finderButton.addEventListener("click", showInFinder);
    sourceButton.addEventListener("click", () => {
      if (fileMenu.hidden) openFileMenu();
      else closeFileMenu();
    });
    document.addEventListener("click", (event) => {
      if (!sourcePicker.contains(event.target)) closeFileMenu();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !fileMenu.hidden) {
        closeFileMenu();
        sourceButton.focus();
      } else if (event.key === "Escape" && measure.enabled) {
        measure.clear();
      }
    });
    treeButton.addEventListener("click", () => {
      treePanel.hidden = !treePanel.hidden;
      treeButton.setAttribute("aria-pressed", String(!treePanel.hidden));
      if (treePanel.hidden) clearSelection();
      resizeViewport();
    });
    document.querySelector("#clear-selection").addEventListener("click", () => clearSelection());
    assignmentHistory.addEventListener("toggle", buildAssignmentHistory);
    aoButton.addEventListener("click", () => {
      aoEnabled = !aoEnabled;
      aoButton.setAttribute("aria-pressed", String(aoEnabled));
      requestRender();
    });
    for (const button of modeButtons) {
      button.addEventListener("click", () => applyMode(button.dataset.mode));
    }
    controls.addEventListener("change", requestRender);

    const events = new EventSource("/events");
    events.addEventListener("change", refreshModelList);
    events.addEventListener("open", () => clearError("Live preview disconnected"));
    events.addEventListener("error", () => showError("Live preview disconnected"));

    function resizeViewport() {
      const width = Math.max(1, viewport.clientWidth);
      const height = Math.max(1, viewport.clientHeight);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      composer.setSize(width, height);
      requestRender();
    }

    const viewportObserver = new ResizeObserver(resizeViewport);
    viewportObserver.observe(viewport);

    requestRender();
  </script>
</body>
</html>
